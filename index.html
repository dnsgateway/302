<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Health Savings App – Demo</title>

<style>
/* ---------- GLOBAL / RESET ---------- */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
     background:#f4f6f8;color:#222;line-height:1.4}

/* ---------- PAGE LAYOUT ---------- */
.hero{display:flex;flex-wrap:wrap;align-items:center;min-height:100vh;padding:5vw}
.copy{flex:1 1 400px;padding-right:5vw}
.device{flex:1 1 320px;display:flex;justify-content:center}

/* ---------- COPY COLUMN ---------- */
h1{font-size:clamp(2rem,4vw,3rem);color:#0d63ce;margin-bottom:1rem}
p.lead{font-size:1.15rem;max-width:480px;margin-bottom:1.8rem}
button.cta{padding:1rem 2rem;border:none;border-radius:8px;background:#0d63ce;
           color:#fff;font-size:1.05rem;cursor:pointer}
button.cta:hover{background:#094fb3}

/* ---------- iPHONE MOCKUP SHELL ---------- */
.phone{width:320px;height:640px;padding:16px;background:#000;border-radius:36px;position:relative;
       box-shadow:0 18px 34px rgba(0,0,0,.25)}
.phone::before{content:'';position:absolute;top:14px;left:50%;transform:translateX(-50%);
               width:130px;height:28px;background:#000;border-radius:14px}

/* ---------- APP SCREEN ---------- */
.screen{position:relative;width:100%;height:100%;background:#fff;border-radius:24px;overflow:hidden}
header.app-title{padding:18px 0;text-align:center;font-size:1.45rem;font-weight:600}

.section{padding:0 16px}
.balance-card{background:#fff;border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.08);
              padding:20px;display:flex;align-items:center;gap:18px;margin-bottom:18px}
.balance-card .circle{width:58px;height:58px;border-radius:50%;background:#0d63ce;
                      display:flex;align-items:center;justify-content:center}
.balance-card .circle svg{width:34px;height:34px;fill:#fff}
.balance-info h3{font-size:1rem;font-weight:600}
.balance-info .amt{font-size:1.6rem;font-weight:700;margin-top:2px}

button.save-more{margin-top:14px;width:100%;padding:.9rem 0;border:none;border-radius:10px;
                 background:#0d63ce;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
button.save-more:active{background:#094fb3}

/* Savings Options */
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.08);
      padding:18px;text-align:center;cursor:pointer;transition:.2s}
.card:hover{box-shadow:0 4px 10px rgba(0,0,0,.12)}
.card svg{width:44px;height:44px;fill:#0d63ce;margin-bottom:8px}
.card span{font-size:.93rem;font-weight:600;display:block}

/* Bottom Navigation */
.navbar{position:absolute;left:0;right:0;bottom:0;height:56px;background:#fff;border-top:1px solid #ddd;
        display:flex}
.navbar button{flex:1;background:none;border:none;font-size:.75rem;color:#777;display:flex;
               flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.navbar svg{width:20px;height:20px;margin-bottom:1px;fill:currentColor}
.navbar button.active{color:#0d63ce;font-weight:600}

/* Bottom Sheet */
.sheet{position:absolute;left:0;right:0;bottom:-100%;height:44%;background:#fff;
       border-top-left-radius:18px;border-top-right-radius:18px;
       box-shadow:0 -6px 16px rgba(0,0,0,.22);padding:24px;transition:.4s}
.sheet.open{bottom:0}
.sheet h3{font-size:1.2rem;margin-bottom:.75rem}
.sheet button{margin-top:20px;padding:.8rem 1.3rem;border:none;border-radius:8px;background:#0d63ce;
              color:#fff;font-size:.9rem;cursor:pointer}

@media(max-width:820px){.hero{flex-direction:column;text-align:center}.copy{padding-right:0;margin-bottom:3rem}}
</style>
</head>
<body>

<section class="hero">
  <!-- COPY / MARKETING -->
  <div class="copy">
    <h1>Save on Health Expenses</h1>
    <p class="lead">CareLift Savings helps low-income and senior patients build health funds, unlock Rx discounts, and find affordable care providers.</p>
    <button class="cta" onclick="document.querySelector('.device').scrollIntoView({behavior:'smooth'})">
      Try Interactive Demo
    </button>
  </div>

  <!-- iPHONE MOCKUP -->
  <div class="device">
    <div class="phone">
      <div class="screen">
        <!-- Title -->
        <header class="app-title">Health Savings<br>App</header>

        <!-- Account & Save More -->
        <div class="section">
          <div class="balance-card">
            <div class="circle">
              <svg viewBox="0 0 24 24"><text x="6" y="17" font-family="sans-serif" font-size="18" fill="#fff">$</text></svg>
            </div>
            <div class="balance-info">
              <h3>Account Balance</h3>
              <div class="amt" id="balance">$250.00</div>
            </div>
          </div>
          <button class="save-more" id="saveMore">Save More</button>
        </div>

        <!-- Savings Options -->
        <div class="section" style="margin-top:22px">
          <h3 style="font-size:1.1rem;margin-bottom:14px;font-weight:600">Savings Options</h3>
          <div class="options">
            <div class="card" id="rxCard">
              <svg viewBox="0 0 24 24"><path d="M16 2H8a2 2 0 0 0-2 2v2h12V4a2 2 0 0 0-2-2zM6 8v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8H6zm3 4h2v2H9v-2zm4 0h2v2h-2v-2z"/></svg>
              <span>Rx&nbsp;Discounts</span>
            </div>
            <div class="card" id="providerCard">
              <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm7 7v-1a3 3 0 0 0-3-3H8a3 3 0 0 0-3 3v1z"/></svg>
              <span>Find<br>Provider</span>
            </div>
          </div>
        </div>

        <!-- Bottom Nav -->
        <div class="navbar" id="navBar">
          <button class="active" onclick="setTab(this)">
            <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9v9h-6v-6h-6v6H3z"/></svg>Home
          </button>
          <button onclick="setTab(this)">
            <svg viewBox="0 0 24 24"><path d="M12 2C9.33 2 4 4.67 4 8v8h16V8c0-3.33-5.33-6-8-6zm0 15c-3 0-6 1.34-6 2v1h12v-1c0-.66-3-2-6-2z"/></svg>Savings
          </button>
          <button onclick="setTab(this)">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>More
          </button>
        </div>

        <!-- Bottom Sheet -->
        <div class="sheet" id="sheet">
          <h3 id="sheetTitle">Placeholder</h3>
          <p id="sheetText">Some descriptive text…</p>
          <button onclick="toggleSheet()">Close</button>
        </div>

      </div><!-- /.screen -->
    </div><!-- /.phone -->
  </div><!-- /.device -->
</section>

<script>
/* ---------- INTERACTIVITY ---------- */
const balanceEl = document.getElementById('balance');
let balance = 250;

document.getElementById('saveMore').addEventListener('click',()=>{
  balance += 10;
  balanceEl.textContent = `$${balance.toFixed(2)}`;
});

const sheet   = document.getElementById('sheet');
const sheetT  = document.getElementById('sheetTitle');
const sheetTxt= document.getElementById('sheetText');

function openSheet(title,txt){
  sheetT.textContent = title;
  sheetTxt.textContent = txt;
  sheet.classList.add('open');
}
function toggleSheet(){ sheet.classList.remove('open'); }

document.getElementById('rxCard')
        .addEventListener('click',()=>openSheet('Rx Discounts','Show discount coupons & pharmacies near you.'));
document.getElementById('providerCard')
        .addEventListener('click',()=>openSheet('Find Provider','Locate affordable practitioners in your area.'));

function setTab(btn){
  document.querySelectorAll('#navBar button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
</body>
</html>
